[package]
name = "rt-adaptive"
version = "0.1.0"
authors = ["Sébastien LUNDI"]
edition = "2024"
license = "MIT"
description = "Adaptive-filter plugin (LV2 / CLAP / VST3) built on rt-adaptive-core: a feedback suppressor, a mains-hum remover, and an NLMS echo canceller in one plugin with a mode selector.  See docs/Roadmap-09-adaptive-filters.md."
repository = "https://codeberg.org/slundi/rt-fft-convolver"
publish = false

[lib]
# `cdylib` is what the CLAP/VST3 bundles load; `lib` keeps unit tests working.
crate-type = ["lib", "cdylib"]

[features]
# The nih-plug wrapper is opt-in so `cargo test`/`clippy` stay fast and offline.
# Build the actual plugin with `cargo build -p rt-adaptive --features nih`.
# The Phase-3 nih-plug-egui editor will land behind a `gui` feature.
default = []
nih = ["dep:nih_plug"]

[dependencies]
# The adaptive-filter DSP engines (feedback / hum / echo).
rt-adaptive-core = { path = "../rt-adaptive-core" }
# Shared plugin foundation: lock-free control→audio handoff for the echo bank.
rt-ir-plugin-core = { path = "../rt-ir-plugin-core" }
# DenormalGuard on the audio thread + dB↔linear helpers.
rt-fft-convolver = { path = ".." }

# nih-plug is git-only (not on crates.io) and heavy; pulled in only for `nih`.
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", optional = true }
