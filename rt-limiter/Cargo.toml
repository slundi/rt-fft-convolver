[package]
name = "rt-limiter"
version = "0.1.0"
authors = ["Sébastien LUNDI"]
edition = "2024"
license = "MIT"
description = "True-peak look-ahead brick-wall limiter / maximiser plugin (LV2 / CLAP / VST3) built on rt-limiter-core.  See docs/Roadmap-07-true-peak-limiter.md."
repository = "https://codeberg.org/slundi/rt-fft-convolver"
publish = false

[lib]
# `cdylib` is what the CLAP/VST3 bundles load; `lib` keeps unit tests working.
crate-type = ["lib", "cdylib"]

[features]
# The nih-plug wrapper is opt-in so `cargo test`/`clippy` stay fast and offline.
# Build the actual plugin with `cargo build -p rt-limiter --features nih`.
default = []
nih = ["dep:nih_plug"]
# Output dither / noise-shaper (forwards to rt-limiter-core's `dither`).
dither = ["rt-limiter-core/dither"]

[dependencies]
# The true-peak limiter engine.
rt-limiter-core = { path = "../rt-limiter-core" }
# Shared plugin foundation: lock-free control→audio handoff + MIDI routing.
rt-ir-plugin-core = { path = "../rt-ir-plugin-core" }
# DenormalGuard on the audio thread + dB↔linear helpers.
rt-fft-convolver = { path = ".." }

# nih-plug is git-only (not on crates.io) and heavy; pulled in only for `nih`.
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", optional = true }
