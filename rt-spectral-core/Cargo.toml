[package]
name = "rt-spectral-core"
version = "0.1.0"
authors = ["Sébastien LUNDI"]
edition = "2024"
license = "MIT"
description = "Real-time spectral (STFT) processing primitives: Wiener denoise with decision-directed SNR, spectral gate / compressor, spectral-flux transient soft-bypass, plus time-domain hum-notch and click-repair stages.  Framework-agnostic (no plugin-format dependency)."
repository = "https://codeberg.org/slundi/rt-fft-convolver"
keywords = ["dsp", "denoise", "stft", "wiener", "audio"]
categories = ["multimedia::audio"]

[dependencies]
# Real-to-complex FFT wrapper reused for the STFT front-end (Roadmap-04
# Prerequisites: same `realfft`-backed abstraction as the convolver).  Also
# provides the `Complex<f32>` type used for spectrum buffers.
realfft = "3.5"
# Shared RT-safe primitives from the root crate: the fixed-capacity `Ring<T>`
# FIFO backing STFT framing, the `DenormalGuard` for near-silent spectral
# bins, and the dB/linear gain helpers.
rt-fft-convolver = { path = ".." }
# Lock-free single-producer / single-consumer hand-off for the noise profile
# (Roadmap-04 "Profile hot-swap").  The capture thread `publish`es a new
# profile; the audio thread `current()` read is wait-free and allocation-free.
# Chosen over `arc-swap` because it is already in the workspace lockfile and
# fits the exact one-writer / one-reader topology here.
triple_buffer = "8.1"
