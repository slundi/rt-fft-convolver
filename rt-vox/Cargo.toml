[package]
name = "rt-vox"
version = "0.1.0"
authors = ["Sébastien LUNDI"]
edition = "2024"
license = "MIT"
description = "Voice-processing plugin (LV2 / CLAP / VST3) built on rt-vox-core: a vocoder, a MIDI harmoniser, and an independent formant shifter in one plugin with a mode selector.  See docs/Roadmap-08-vocoder-harmonizer.md."
repository = "https://codeberg.org/slundi/rt-fft-convolver"
publish = false

[lib]
# `cdylib` is what the CLAP/VST3 bundles load; `lib` keeps unit tests working.
crate-type = ["lib", "cdylib"]

[features]
# The nih-plug wrapper is opt-in so `cargo test`/`clippy` stay fast and offline.
# Build the actual plugin with `cargo build -p rt-vox --features nih`.
# `gui` adds the Phase-3 nih-plug-egui editor.
default = []
nih = ["dep:nih_plug"]
gui = ["nih", "dep:nih_plug_egui"]

[dependencies]
# The voice-processing DSP engines (vocoder / harmoniser / formant shifter).
rt-vox-core = { path = "../rt-vox-core" }
# Swappable pitch-shift back-ends + window kinds for the formant-mode pitch path.
rt-pitch-core = { path = "../rt-pitch-core" }
# Shared plugin foundation: lock-free control→audio handoff.
rt-ir-plugin-core = { path = "../rt-ir-plugin-core" }
# DenormalGuard on the audio thread + dB↔linear helpers.
rt-fft-convolver = { path = ".." }

# nih-plug is git-only (not on crates.io) and heavy; pulled in only for `nih`.
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", optional = true }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", optional = true }
