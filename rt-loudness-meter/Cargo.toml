[package]
name = "rt-loudness-meter"
version = "0.1.0"
authors = ["Sébastien LUNDI"]
edition = "2024"
license = "MIT"
description = "EBU R128 / ITU-R BS.1770-4 loudness metering plugin (LV2 / CLAP / VST3) built on rt-loudness-core: momentary / short-term / integrated LUFS, LRA, true-peak and sample-peak, with delivery-target compliance and off-RT CSV/JSON logging.  See docs/Roadmap-10-loudness-metering.md."
repository = "https://codeberg.org/slundi/rt-fft-convolver"
publish = false

[lib]
# `cdylib` is what the CLAP/VST3 bundles load; `lib` keeps unit tests working.
crate-type = ["lib", "cdylib"]

[features]
# The nih-plug wrapper is opt-in so `cargo test`/`clippy` stay fast and offline.
# Build the actual plugin with `cargo build -p rt-loudness-meter --features nih`.
# `gui` adds the Phase-3 nih-plug-egui editor.
default = []
nih = ["dep:nih_plug", "dep:parking_lot"]
gui = ["nih", "dep:nih_plug_egui"]

[dependencies]
# The BS.1770-4 measurement engine (K-weighting, integrator, true-peak, LRA,
# lock-free broadcast).
rt-loudness-core = { path = "../rt-loudness-core" }
# DenormalGuard on the audio thread + dB↔linear helpers for the readouts.
rt-fft-convolver = { path = ".." }

# nih-plug is git-only (not on crates.io) and heavy; pulled in only for `nih`.
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", optional = true }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", optional = true }
# Persisted-state Mutex for the log-file path (comes with nih-plug's stack).
parking_lot = { version = "0.12", optional = true }
