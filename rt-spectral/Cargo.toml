[package]
name = "rt-spectral"
version = "0.1.0"
authors = ["Sébastien LUNDI"]
edition = "2024"
license = "MIT"
description = "Real-time spectral (STFT) processing plugin (LV2 / CLAP / VST3) built on rt-spectral-core.  Learn-seeded Wiener denoise, spectral gate / compressor, time-domain hum-notch and click-repair.  See docs/Roadmap-04-spectral-processing.md."
repository = "https://codeberg.org/slundi/rt-fft-convolver"
publish = false

[lib]
# `cdylib` is what the CLAP/VST3 bundles load; `lib` keeps unit tests working.
crate-type = ["lib", "cdylib"]

[features]
# The nih-plug wrapper is opt-in so `cargo test`/`clippy` stay fast and offline.
# Build the actual plugin with `cargo build -p rt-spectral --features nih`.
# The nih-plug-egui editor (spectrogram, profile overlay) lands in Phase 3.
default = []
nih = ["dep:nih_plug"]

[dependencies]
# The spectral DSP engine (STFT front-end + per-bin / time-domain operators).
rt-spectral-core = { path = "../rt-spectral-core" }
# For DenormalGuard on the audio thread.
rt-fft-convolver = { path = ".." }
# Lock-free, allocation-free audio→control hand-off of the Learn capture buffer
# (same primitive the core uses for the profile hot-swap, one-writer/one-reader).
triple_buffer = "8.1"

# nih-plug is git-only (not on crates.io) and heavy; pulled in only for `nih`.
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", optional = true }
